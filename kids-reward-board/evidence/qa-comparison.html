<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小集點王｜設計比較</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d8d7d2; color: #1d2220; font-family: system-ui, sans-serif; }
  main { width: 900px; margin: 0; padding: 32px; }
  section { margin-bottom: 34px; padding: 24px; background: #f4f2eb; }
  h1 { margin: 0 0 24px; font-size: 28px; }
  h2 { margin: 0 0 16px; font-size: 20px; }
  .pair { display: grid; grid-template-columns: 390px 390px; gap: 20px; align-items: start; }
  figure { margin: 0; }
  figcaption { margin-bottom: 8px; color: #5c625f; font-size: 13px; font-weight: 700; }
  img { display: block; width: 390px; height: auto; background: #fff; }
</style>
</head>
<body>
<main>
  <h1>小小集點王｜來源與實作比較</h1>
  <section id="compare-adventure">
    <h2>冒險地圖</h2>
    <div class="pair">
      <figure><figcaption>來源視覺</figcaption><img src="source-adventure.png" alt="冒險地圖來源視覺"></figure>
      <figure><figcaption>共用功能骨架實作</figcaption><img src="../implementation-mobile-adventure.png" alt="冒險地圖實作畫面"></figure>
    </div>
  </section>
  <section id="compare-sticker">
    <h2>今日貼紙簿</h2>
    <div class="pair">
      <figure><figcaption>來源視覺</figcaption><img src="source-sticker.png" alt="今日貼紙簿來源視覺"></figure>
      <figure><figcaption>共用功能骨架實作</figcaption><img src="../implementation-mobile-sticker.png" alt="今日貼紙簿實作畫面"></figure>
    </div>
  </section>
  <section id="compare-shop">
    <h2>家庭小商店</h2>
    <div class="pair">
      <figure><figcaption>來源視覺</figcaption><img src="source-shop.png" alt="家庭小商店來源視覺"></figure>
      <figure><figcaption>共用功能骨架實作</figcaption><img src="../implementation-mobile-shop.png" alt="家庭小商店實作畫面"></figure>
    </div>
  </section>
</main>
</body>
</html>
