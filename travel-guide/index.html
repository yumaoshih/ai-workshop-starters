<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>旅遊指南</title>
<style>
  :root{
    --bg:#f7f4ec; --card:#fff; --ink:#2a2724; --muted:#6b655c;
    --accent:#b76b3b; --progress:#b76b3b; --border:#e2dccb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    background:var(--bg);color:var(--ink);
    height:100vh;overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh}
  header{
    padding:12px 16px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);
  }
  h1{font-size:16px;margin:0}
  .progress{font-size:12px;color:var(--muted);background:var(--bg);padding:4px 8px;border-radius:999px}
  main{
    flex:1;position:relative;overflow:hidden;
    background:var(--card);
  }
  .page{
    position:absolute;inset:0;padding:20px;opacity:0;pointer-events:none;
    transition:opacity .25s;overflow-y:auto;
  }
  .page.active{opacity:1;pointer-events:auto}
  .page h2{font-size:18px;margin:0 0 8px}
  .page p{margin:0 0 10px;line-height:1.5;font-size:14px}
  .page ul{margin:0;padding-left:18px;font-size:14px}
  .hint{position:absolute;top:12px;right:14px;color:var(--muted);font-size:12px}
  .pagination{
    position:absolute;inset:0;pointer-events:none;
  }
  .page-turn{
    position:absolute;top:0;bottom:0;width:56px;cursor:pointer;
  }
  .page-turn.left{left:0;background:linear-gradient(90deg, rgba(0,0,0,0.05), transparent);opacity:0;transition:opacity .2s}
  .page-turn.right{right:0;background:linear-gradient(270deg, rgba(0,0,0,0.05), transparent);opacity:0;transition:opacity .2s}
  .page-wrap:hover .page-turn.left,
  .page-wrap:focus-within .page-turn.left,
  .page-wrap .page-wrap:hover .page-turn.left{opacity:1}
  .page-turn:hover, .page-turn:focus{opacity:1 !important}
  .page-wrap{outline:none}
  footer{
    padding:12px 16px;border-top:1px solid var(--border);background:var(--card);
  }
  .checklist-label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .checklist-label input{accent-color:var(--accent)}
  .controls{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
  button{
    background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;
  }
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  button:focus-visible{outline:3px solid #6fb3ff;outline-offset:2px}
  .page-info{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--card);padding:2px 10px;border-radius:999px;border:1px solid var(--border)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>臺南兩日行</h1>
    <span class="progress" id="progress">1 / 7</span>
  </header>
  <main id="main">
    <div class="pagination" id="pagination">
      <div class="page-turn left" id="prev-zone" role="button" tabindex="0" aria-label="上一頁"></div>
      <div class="page-turn right" id="next-zone" role="button" tabindex="0" aria-label="下一頁"></div>
    </div>
    <div id="pages"></div>
    <div class="page-info" id="page-info">第 1 頁，共 7 頁</div>
  </main>
  <footer>
    <div style="font-size:13px;margin-bottom:6px">行程勾選</div>
    <div id="checklist"></div>
    <div class="controls">
      <button id="btn-prev" class="ghost" type="button">上一頁</button>
      <button id="btn-reset" class="ghost" type="button">重置勾選</button>
      <button id="btn-next" type="button">下一頁</button>
    </div>
  </footer>
</div>
<script>
(function(){
  const NS = 'travel-v1';
  const PAGES = [
    {
      title:'出發前準備',
      body:'<ul><li>確認交通票券</li><li>準備支付現金與證件</li><li>填寫本指南勾選清單</li></ul><p>建議出發前一天完成清單。</p>'
    },
    {
      title:'抵達臺南',
      body:'<p>從高鐵站搭乘公車或計程車至市區。建議慢慢探索，先找個咖啡店休息。</p>'
    },
    {
      title:'臺南舊城',
      body:'<p>閩南風建築保留許多歷史店家，可散步於民權路、成功路一帶。</p><ul><li>逛百年市井</li><li>找一家老咖啡店</li></ul>'
    },
    {
      title:'夜市一廳',
      body:'<p>南瑪紐夜市以小吃與遊戲聞名，可嘗鮮、買伴手禮。</p><ul><li>牛肉湯</li><li>蝦捲</li><li>芋頭牛奶</li></ul>'
    },
    {
      title:'兵衛祠與藝術',
      body:'<p>近河岸的文化空間，適合閒適走走。查看當日展覽排程。</p>'
    },
    {
      title:'最後一餐',
      body:'<p>返回市區前，找一家在地餐館享用晚餐。可回顧今天走過的路。</p>'
    },
    {
      title:'返程',
      body:'<p>收拾行李，確認遺留物品，搭車返程。帶著行程筆記回家。</p><ul><li>確認行李</li><li>回收車票</li></ul>'
    }
  ];
  function saveChecklist(items){ try{ localStorage.setItem(NS+':checklist', JSON.stringify(items)); }catch(e){} }
  function loadChecklist(){ try{ const raw=localStorage.getItem(NS+':checklist'); if(raw){ const p=JSON.parse(raw); if(Array.isArray(p)) return p; } }catch(e){} return null; }
  let current = 0;
  function renderPages(){
    const host = document.getElementById('pages');
    host.innerHTML = '';
    PAGES.forEach((p,i)=>{
      const div = document.createElement('div');
      div.className = 'page' + (i===current ? ' active' : '');
      div.innerHTML = `<h2>${p.title}</h2>${p.body}`;
      host.appendChild(div);
    });
    document.getElementById('progress').textContent = (current+1) + ' / ' + PAGES.length;
    document.getElementById('page-info').textContent = '第 ' + (current+1) + ' 頁，共 ' + PAGES.length + ' 頁';
  }
  function renderChecklist(){
    const host = document.getElementById('checklist');
    const items = loadChecklist() || [];
    host.innerHTML = '';
    items.forEach((labeled,i)=>{
      const label = document.createElement('label');
      label.className = 'checklist-label';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = labeled.done;
      cb.addEventListener('change', ()=>{
        items[i].done = cb.checked;
        saveChecklist(items);
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(labeled.label));
      host.appendChild(label);
    });
  }
  function addChecklistPreview(){
    const host = document.getElementById('checklist');
    const existing = Array.from(host.children).length;
    if(existing < 5){
      const items = loadChecklist() || [];
      const fresh = [
        {label:'記得護照／證件', done:false},
        {label:'查看天氣', done:false},
        {label:'帶快門oo', done:false}
      ];
      const target = fresh.find(f=>!items.some(i=>i.label===f.label));
      if(target){
        items.push(target);
        saveChecklist(items);
        renderChecklist();
      }
    }
  }
  function showPage(i){
    current = Math.max(0, Math.min(PAGES.length-1, i));
    const pages = document.querySelectorAll('.page');
    pages.forEach((el,idx)=> el.classList.toggle('active', idx===current));
    document.getElementById('progress').textContent = (current+1) + ' / ' + PAGES.length;
    document.getElementById('page-info').textContent = '第 ' + (current+1) + '頁，共 ' + PAGES.length + '頁';
  }
  function next(){ showPage(current+1); }
  function prev(){ showPage(current-1); }
  document.getElementById('btn-next').addEventListener('click', next);
  document.getElementById('btn-prev').addEventListener('click', prev);
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    const items = (loadChecklist() || []).map(item=>({...item, done:false}));
    saveChecklist(items);
    renderChecklist();
  });
  let pointerStartX = null;
  document.getElementById('main').addEventListener('pointerdown', e=>{ pointerStartX = e.clientX; });
  document.getElementById('main').addEventListener('pointerup', e=>{
    if(pointerStartX === null) return;
    const dx = e.clientX - pointerStartX;
    pointerStartX = null;
    if(dx < -50) next();
    else if(dx > 50) prev();
  });
  document.getElementById('next-zone').addEventListener('click', (e)=>{ e.preventDefault(); next(); });
  document.getElementById('prev-zone').addEventListener('click', (e)=>{ e.preventDefault(); prev(); });
  document.getElementById('next-zone').addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); next(); }});
  document.getElementById('prev-zone').addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); prev(); }});
  document.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  });
  renderPages();
  renderChecklist();
  addChecklistPreview();
})();
</script>
</body>
</html>
