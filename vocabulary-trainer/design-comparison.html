<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Lab 設計比較</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #153229; color: #fff; font-family: system-ui, sans-serif; }
    main { display: grid; grid-template-columns: repeat(2, 390px); gap: 22px; align-items: start; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; color: #ccebdd; font-size: 13px; font-weight: 800; }
    img { display: block; width: 390px; height: 844px; object-fit: cover; object-position: top; border: 1px solid #ccebdd; background: #f4f0e5; }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>參考設計（等比例縮放至 390 × 844）</figcaption>
      <img src="reference-option-1.png" alt="方案 1 參考設計">
    </figure>
    <figure>
      <figcaption>實作畫面（390 × 844）</figcaption>
      <img src="implementation-mobile-faithful-full.png?v=5" alt="Word Lab 實作畫面">
    </figure>
  </main>
</body>
</html>
