<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起賓果設計比對</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:24px;background:#211f1d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
  h1{margin:0 0 22px;font-size:26px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:30px;align-items:start}
  figure{margin:0;background:#34312e;border-radius:12px;padding:10px}figcaption{font-weight:800;padding:4px 4px 10px}img{display:block;width:100%;height:auto;border-radius:6px;background:#fbf7f0}
</style>
</head>
<body>
  <h1>一起賓果：參考稿與實作比對</h1>
  <section class="row">
    <figure><figcaption>入口參考稿</figcaption><img src="reference-product-landing.png" alt="入口參考稿"></figure>
    <figure><figcaption>入口實作</figcaption><img src="product-landing.png" alt="入口實作"></figure>
  </section>
  <section class="row">
    <figure><figcaption>主持大廳參考稿</figcaption><img src="reference-product-host-lobby.png" alt="主持大廳參考稿"></figure>
    <figure><figcaption>主持大廳實作</figcaption><img src="product-host-lobby.png" alt="主持大廳實作"></figure>
  </section>
</body>
</html>
